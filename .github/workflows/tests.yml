name: Python tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo.py
      - run: python scripts/diagnose.py demo
      - run: python scripts/demo_runner.py --output examples/transcripts
      - run: python scripts/evaluate.py --output evaluation/results.json --markdown docs/evaluation.md
      - run: git diff --exit-code -- examples/transcripts evaluation/results.json docs/evaluation.md
